<style>
:root{--cream:#FFFDF7;--ink:#1A1A1A;--red:#E8352E;--yellow:#FFF1B8;--grey:#555;--line:#1A1A1A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);line-height:1.6}
.wrap{display:flex;max-width:1200px;margin:0 auto;min-height:100vh}
.rail{width:214px;flex-shrink:0;padding:26px 12px;border-right:2px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto}

.crumb{font-size:12px;color:var(--red);font-weight:700;letter-spacing:2px}

.cc{background:#fff;border:2px solid var(--line);border-radius:10px;padding:11px 15px}
.cc.prod{border-left:8px solid var(--red)}.cc.cog{border-left:8px solid #5a7d8c}
.cc .cch{font-weight:700;font-size:13px;margin-bottom:3px}.cc.prod .cch b{color:var(--red)}.cc.cog .cch b{color:#3d6d80}
.cc .ccd{font-size:12.5px;color:#333}

.demonote code{background:#f0e4c8;padding:1px 5px;border-radius:4px;font-size:11.5px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px}
@media(max-width:720px){.ex{grid-template-columns:1fr}}
.card{border:2px solid var(--line);border-radius:10px;overflow:hidden}
.card .h{font-size:12.5px;font-weight:700;padding:6px 12px;color:#fff}
.card.s .h{background:#5a7d5a}.card.c .h{background:var(--red)}
.card pre{border:none;border-radius:0;margin:0;font-size:12px;padding:12px}
.card .why{font-size:12.5px;padding:10px 12px;color:#444;background:#faf7ef}
pre{background:#0d0d0d;color:#e8e8e8;padding:15px;border-radius:10px;overflow-x:auto;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;border:2px solid var(--line)}
.ln{color:#666;user-select:none;display:inline-block;width:24px;text-align:right;margin-right:13px}
.hl{background:rgba(232,53,46,.22);display:block;margin:0 -15px;padding:0 15px;border-left:3px solid var(--red)}
.chk{list-style:none}.chk li{padding:5px 0;cursor:pointer;font-size:14px}.chk li:before{content:"\2610 ";color:var(--red);font-weight:700}
.chk li.done{color:#999;text-decoration:line-through}.chk li.done:before{content:"\2611 "}
.think{background:#fff;border:2px dashed var(--red);border-radius:10px;padding:13px 18px;font-size:14px}.think b{color:var(--red)}
.nav{display:flex;justify-content:space-between;margin-top:28px;padding-top:16px;border-top:2px solid var(--line)}
.nav button{font-family:inherit;font-size:14px;font-weight:700;padding:9px 17px;border:2px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.nav button:active{box-shadow:0 0 0;transform:translate(3px,3px)}.nav button:disabled{opacity:.3;cursor:default;box-shadow:none}
@media(max-width:760px){.wrap{flex-direction:column}.rail{width:auto;height:auto;position:static;border-right:none;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap}.main{padding:20px}}

<script>
const DATA = [{"id": "s0", "title": "第一次调用 AI", "sub": "一问一答", "file": "s0_llm.py", "code": "from dotenv import load_dotenv; load_dotenv()                      # 1. 读取 .env 文件中的 API 密钥\nfrom openrouter import OpenRouter                                  # 2. 导入 OpenRouter SDK\nimport os                                                          # 3. 用于读取环境变量\n\nclient = OpenRouter(api_key=os.getenv(\"OPENROUTER_API_KEY\"))       # 4. 创建客户端\nresponse = client.chat.send(                                       # 5. 发送聊天请求\n    model=\"anthropic/claude-opus-4.6\",                             # 6. 选择模型\n    messages=[                                                     # 7. 消息列表（对话历史）\n        {\"role\": \"user\", \"content\": \"你好\"}                         # 8. 一条用户消息\n    ]\n)\nprint(response.choices[0].message.content)                         # 9. 打印 AI 的回复\n# MIT License | 郑先隽，北师大心理学部教授，人本AI设计与创新\n", "highlight": ["from openrouter", "client.chat.send", "print(response"], "goal": "和 AI 说一句、收一句,程序就结束。这是一切的起点。", "product": {"name": "问一次 ChatGPT", "desc": "你在网页上问一句、它答一句——本质就是这段代码干的事,只是套了个漂亮界面。"}, "cognition": {"name": "一次性的反射", "desc": "像膝跳反射:给个刺激、出个反应,做完就忘,没有\"过程\"也没有\"记性\"。"}, "simple": {"cmd": "你：1 + 1 等于几？", "why": "一问一答就够了,这时你完全看不出\"记忆\"\"循环\"有啥用——因为任务太简单。"}, "complex": {"cmd": "你：帮我看看 demo_workspace/心情日记.txt 里那位同学的状态。（再追问一句）", "why": "第一句它能答,但你想\"接着聊\"时,程序已经退出了——它一次只能收一句、答一句。真实咨询/辅导从来不是一句话的事,这就是痛点。"}, "verify": ["打印出 AI 的回答后程序自动退出", "没有 while,没有 input——就是一次调用"], "think": "s0 只能问一次。如果想让它\"接着聊\",代码要加什么?(这正是 s1 要做的)"}, {"id": "s1", "title": "多轮对话", "sub": "while 循环", "file": "s1_chat.py", "code": "from dotenv import load_dotenv; load_dotenv()                      # 1. 读取 .env 文件中的 API 密钥\nfrom openrouter import OpenRouter                                  # 2. 导入 OpenRouter SDK\nimport os                                                          # 3. 用于读取环境变量\n\nwith OpenRouter(                                                   # 4. 创建客户端（with 确保退出时关闭连接）\n    api_key=os.getenv(\"OPENROUTER_API_KEY\")\n) as client:\n    while True:                                                    # 5. 无限循环 = 持续对话\n        user_input = input(\"\\n你：\")                                # 6. 等待用户输入\n        response = client.chat.send(                               # 7. 发送聊天请求\n            model=\"anthropic/claude-opus-4.6\",                     # 8. 选择模型\n            messages=[                                             # 9. 消息列表\n                {\"role\": \"user\", \"content\": user_input}            # 10. 把用户输入作为消息发送\n            ]\n        )\n        print(response.choices[0].message.content)                 # 11. 打印 AI 的回复\n# MIT License | 郑先隽，北师大心理学部教授，人本AI设计与创新\n", "highlight": ["while True", "input(", "print(response"], "goal": "能连续对话,但它\"记不住\"任何事。", "product": {"name": "ChatGPT 网页版的多轮框", "desc": "能一直打字,但如果不把历史发回去,它其实不记得你上一句——s1 就是这个\"健忘\"版本。"}, "cognition": {"name": "没有记忆的对话", "desc": "像跟一个每说完一句就失忆的人聊天:你问、他答,但他记不住刚才说了什么。"}, "simple": {"cmd": "你：你好呀 →（它回）→ 你：今天天气不错", "why": "来回打招呼,每句独立,不需要记忆也聊得下去——看不出问题。"}, "complex": {"cmd": "你：我最近压力很大 →（它回）→ 你：那我该怎么办？", "why": "第二句\"那\"指的是什么?它不知道——因为 s1 每次只把当前这一句发给 AI,上一句根本没带上。辅导/咨询里这是致命的:它会忘掉来访者刚说的事。"}, "verify": ["能连续输入、不退出", "问它\"我刚才说了什么\",它答不上来"], "think": "s1 为什么记不住?它每次发给 AI 的,是\"全部历史\"还是\"就这一句\"?(对比 s2)"}, {"id": "s2", "title": "对话记忆", "sub": "messages 列表", "file": "s2_memory.py", "code": "from dotenv import load_dotenv; load_dotenv()                      # 1. 读取 .env 文件中的 API 密钥\nfrom openrouter import OpenRouter                                  # 2. 导入 OpenRouter SDK\nimport os                                                          # 3. 用于读取环境变量\n\nwith OpenRouter(                                                   # 4. 创建客户端\n    api_key=os.getenv(\"OPENROUTER_API_KEY\")\n) as client:\n    messages = []                                                  # 5. 对话历史（关键！这就是\"记忆\"）\n    while True:                                                    # 6. 无限循环 = 持续对话\n        user_input = input(\"\\n你：\")                                # 7. 等待用户输入\n        messages.append({\"role\": \"user\", \"content\": user_input})   # 8. 把用户消息存入历史\n        response = client.chat.send(                               # 9. 发送完整对话历史给 AI\n            model=\"anthropic/claude-opus-4.6\",                     # 10. 选择模型\n            messages=messages                                      # 11. 传入全部历史，而非单条消息\n        )\n        reply = response.choices[0].message.content                # 12. 提取 AI 回复\n        messages.append({\"role\": \"assistant\", \"content\": reply})   # 13. 把 AI 回复也存入历史\n        print(reply)                                               # 14. 打印 AI 的回复\n# MIT License | 郑先隽，北师大心理学部教授，人本AI设计与创新\n", "highlight": ["messages = []", "messages.append", "messages=messages"], "goal": "用一个 messages 列表存下全部对话,AI 就\"记住\"了。", "product": {"name": "ChatGPT 记住上文", "desc": "同一个对话框里它能顺着聊,是因为每次都把之前的对话一起发过去——s2 这几行就是那个机制。"}, "cognition": {"name": "工作记忆", "desc": "像你做题时脑子里暂存的信息:把说过的话\"端在手上\",才能接着往下想。"}, "simple": {"cmd": "你：我叫小明 →（它回）→ 你：我叫什么？", "why": "它能答\"小明\"。一个来回就验证了记忆,简单但已经能看出区别。"}, "complex": {"cmd": "你：读 demo_workspace/心情日记.txt，我们聊聊 →（多轮）→ 你：结合我一开始说的，给点建议", "why": "多轮之后它还记得日记里的细节和你开头说的话——因为全部历史都在 messages 里。没有这个,长对话就会断片。"}, "verify": ["第二问能接住第一问的内容", "代码里有 messages=[] 和两次 append"], "think": "s2 只加了 3 行(messages=[] + 两次 append),却让 AI\"有了记忆\"。如果少了记录 AI 回复那一次 append,会怎样?"}, {"id": "s3", "title": "Agent 核心", "sub": "双层循环 + 执行命令", "file": "s3_agent.py", "code": "from dotenv import load_dotenv; load_dotenv()                      # 1. 读取 .env 文件中的 API 密钥\nfrom openrouter import OpenRouter                                  # 2. 导入 OpenRouter SDK\nimport os                                                          # 3. 用于读取环境变量和执行命令\n\nwith OpenRouter(                                                   # 4. 创建客户端\n    api_key=os.getenv(\"OPENROUTER_API_KEY\")\n) as client:\n    messages = [{\"role\":\"system\",\"content\":\"\"\"你必须用以下两种格式之一回复：\n- 需要执行命令：命令:XXX（纯命令，不要解释，每次一条）\n- 任务完成时：完成:XXX（总结信息）\"\"\"}]                                # 5. 系统提示词：定义 AI 的输出格式（命令 or 完成）\n\n    while True:                                                    # 6. 外层循环：等待用户输入新任务\n        user_input = input(\"\\n你：\")                                # 7. 等待用户输入\n        messages.append({\"role\": \"user\", \"content\": user_input})   # 8. 存入对话历史\n\n        while True:                                                # 9. 内层循环：Agent 自主执行，直到任务完成\n            response = client.chat.send(                           # 10. 发送对话历史给 AI\n                model=\"anthropic/claude-opus-4.6\",\n                messages=messages\n            )\n            reply = response.choices[0].message.content            # 11. 提取 AI 回复\n            messages.append({\"role\": \"assistant\", \"content\": reply})# 12. 存入历史\n            print(f\"[AI] {reply}\")                                 # 13. 打印 AI 的决策\n\n            if reply.strip().startswith(\"完成:\"):                   # 14. 如果 AI 说\"完成\" → 跳出内层循环\n                break\n\n            command = reply.strip().split(\"命令:\")[1].strip()       # 15. 提取 AI 想执行的命令\n            result = os.popen(command).read()                      # 16. 执行命令，获取输出\n            print(f\"[系统] {result}\")                               # 17. 打印命令结果\n            messages.append({\"role\": \"user\", \"content\": f\"执行完毕:{result}\"})  # 18. 把结果反馈给 AI\n# MIT License | 郑先隽，北师大心理学部教授，人本AI设计与创新\n", "highlight": ["while True", "os.popen", "命令:", "完成:"], "goal": "从\"只会说\"变成\"会动手\":双层循环 + 执行命令。", "product": {"name": "会动手的 Claude Code", "desc": "昨天你指挥的 Claude Code,内核就是这个双层循环:它自己决定下一步、执行、看结果、再决定。"}, "cognition": {"name": "从\"想\"到\"做\"", "desc": "前面 s0–s2 只会\"想和说\";s3 第一次能\"行动\"——感知→决策→行动→再感知,像真的在干活。"}, "simple": {"cmd": "你：列出 demo_workspace 里的文件", "why": "一条命令就完事,和聊天差别不大——看不出\"自主循环\"的威力。"}, "complex": {"cmd": "你：读 demo_workspace/作文 里所有作文，告诉我哪一篇更需要修改", "why": "它会自己 ls → 逐篇 cat → 比较 → 下判断,连着跑好几轮,你只说了一句话。聊天机器人做不到这个——这就是 Agent 的自主性。"}, "verify": ["看到它自己连续执行多条命令", "最后给出基于文件内容的判断"], "think": "s3 的内层循 let cur = 0;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function codeHTML(d){
  return d.code.split("\n").map(function(ln,i){
    var e=esc(ln), hit=d.highlight.some(function(h){return ln.indexOf(h)>=0});
    var num='<span class="ln">'+(i+1)+'</span>';
    return hit?'<span class="hl">'+num+e+'</span>':num+e;
  }).join("\n");
}

}
